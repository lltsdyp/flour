[package]
name = "flour"
version = "0.1.0"
edition = "2021"

[lib]
name = "flour"
path = "src/lib.rs"

[[bin]]
name = "flour"
path = "src/main.rs"

[dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
half = "2"
tokenizers = { version = "0.21.4", features = ["onig"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
anyhow = "1.0.86"
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
rand = "0.8.5"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
axum = "0.8.9"
async-stream = "0.3.6"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
reqwest = { version = "0.12.12", features = ["json"] }

[dev-dependencies]
tempfile = "3.13.0"
http-body-util = "0.1"
