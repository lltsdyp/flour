# Co-located distributed KV cache cluster for flour:
#   1 Master (metadata) + 2 co-located nodes (each node = engine + worker in
#   one process/port).
#
# Bring it up (needs a model on disk):
#   MODEL_DIR=/abs/path/to/model \
#     docker compose -f examples/cluster/docker-compose.yml up --build
#
# All services share one image, so the build runs only once.

# Shared build definition: context is the repo root, two levels up from this file.
x-flour-build: &flour-build
  image: flour-cluster:latest
  build:
    context: ../..
    dockerfile: examples/cluster/Dockerfile

services:
  master:
    <<: *flour-build
    command: ["flour-master", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      RUST_LOG: info
    ports:
      - "8081:8081" # metadata path, handy for curl smoke tests

  # Co-located nodes: each runs the engine AND an embedded worker in one
  # process/port. Mount a model dir via MODEL_DIR.
  node1:
    <<: *flour-build
    command:
      - flour
      - --model-dir=/models
      - --dtype=f16
      - --host=0.0.0.0
      - --port=8080
      - --colocated-worker
      - --worker-id=node1
      - --advertise-url=http://node1:8080
      - --remote-kv-master-url=http://master:8081
      - --distkv-capacity-bytes=1073741824
    environment:
      RUST_LOG: info
    volumes:
      - ${MODEL_DIR:-./model}:/models:ro
    ports:
      - "8080:8080"
    depends_on:
      - master

  node2:
    <<: *flour-build
    command:
      - flour
      - --model-dir=/models
      - --dtype=f16
      - --host=0.0.0.0
      - --port=8080
      - --colocated-worker
      - --worker-id=node2
      - --advertise-url=http://node2:8080
      - --remote-kv-master-url=http://master:8081
      - --distkv-capacity-bytes=1073741824
    environment:
      RUST_LOG: info
    volumes:
      - ${MODEL_DIR:-./model}:/models:ro
    ports:
      - "8082:8080" # node1 already owns host 8080; node2 published on 8082
    depends_on:
      - master
